# 角色上限权限模板。
# 这里定义的是角色级最大可见范围，不是当前 task 的实际生效范围。
# 实际执行时，应该再与 tasks.md 中的 task 级访问范围取交集。
# `literal:` 表示固定路径模式。
# `resolver:` 表示需要按当前状态和 task 文档动态解析。
# 调度器应按 Quick SDD 的 dispatcher-resolution-spec 执行，不要把 resolver 当自由文本解释。

scope_resolution:
  active_feature:
    kind: state_field
    path: active_feature

  active_task:
    kind: state_field
    path: active_dispatch.task

  active_story:
    kind: state_field
    path: active_dispatch.story
    fallback:
      kind: task_field
      optional: true
      feature_ref: active_feature
      task_ref: active_task
      field: story_id

  task_read_paths:
    kind: task_field
    optional: true
    feature_ref: active_feature
    task_ref: active_task
    field: read_paths

  task_write_paths:
    kind: task_field
    optional: true
    feature_ref: active_feature
    task_ref: active_task
    field: write_paths

  story_task_write_paths:
    kind: story_task_union
    optional: true
    feature_ref: active_feature
    story_ref: active_story
    field: write_paths

roles:
  # pm 负责路由、状态推进和索引维护，因此需要读取整个 codespec。
  pm:
    read:
      - literal: codespec/**
    write:
      - literal: codespec/README.md
      - literal: codespec/runtime/**

  # ra 负责 proposal 与最终需求验收；验收时可读取完整文档链和相关实现范围。
  ra:
    read:
      - literal: codespec/README.md
      - literal: codespec/specs/**/proposal.md
      - literal: codespec/specs/**/stories.md
      - literal: codespec/specs/**/architecture.md
      - literal: codespec/specs/**/tasks.md
      - literal: codespec/specs/**/validation-report.md
      - literal: codespec/specs/**/acceptance.md
      - resolver: story_task_write_paths
    write:
      - literal: codespec/specs/**/proposal.md
      - literal: codespec/specs/**/acceptance.md

  # ta 负责 story、架构设计和 task 审计；tasks.md 的主责任人仍是 dev。
  ta:
    read:
      - literal: codespec/specs/**/proposal.md
      - literal: codespec/specs/**/stories.md
      - literal: codespec/specs/**/architecture.md
      - literal: codespec/specs/**/tasks.md
    write:
      - literal: codespec/specs/**/stories.md
      - literal: codespec/specs/**/architecture.md
      - literal: codespec/specs/**/tasks.md

  # dev 负责任务文档和实现；没有 active task 时只应写 tasks.md。
  dev:
    read:
      - literal: codespec/README.md
      - literal: codespec/specs/${active_feature}/proposal.md
      - literal: codespec/specs/${active_feature}/stories.md
      - literal: codespec/specs/${active_feature}/architecture.md
      - literal: codespec/specs/${active_feature}/tasks.md
      - literal: codespec/specs/${active_feature}/acceptance.md
      - resolver: task_read_paths
    write:
      - literal: codespec/specs/${active_feature}/tasks.md
      - resolver: task_write_paths

  # qa 审计当前 feature 的全部 SDD 文档、当前 story 涉及的代码范围，并回写验证报告。
  qa:
    read:
      - literal: codespec/README.md
      - literal: codespec/specs/${active_feature}/proposal.md
      - literal: codespec/specs/${active_feature}/stories.md
      - literal: codespec/specs/${active_feature}/architecture.md
      - literal: codespec/specs/${active_feature}/tasks.md
      - literal: codespec/specs/${active_feature}/acceptance.md
      - resolver: story_task_write_paths
    write:
      - literal: codespec/specs/${active_feature}/validation-report.md
